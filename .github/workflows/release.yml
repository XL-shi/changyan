name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.14)'
        required: true
        default: 'v0.1.14'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--bundles nsis'
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Check signing status
        if: runner.os == 'macOS'
        id: check-signing
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "has_certificate=true" >> $GITHUB_OUTPUT
            echo "✅ Developer ID certificate detected"
          else
            echo "has_certificate=false" >> $GITHUB_OUTPUT
            echo "🔐 No Developer ID certificate found, will use ad-hoc signing"
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Build Tauri (macOS with certificate)
        if: runner.os == 'macOS' && steps.check-signing.outputs.has_certificate == 'true'
        uses: tauri-apps/tauri-action@v0
        id: tauri-build-macos-cert
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'ChangYan ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri (macOS without certificate)
        if: runner.os == 'macOS' && steps.check-signing.outputs.has_certificate == 'false'
        uses: tauri-apps/tauri-action@v0
        id: tauri-build-macos-nocert
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'ChangYan ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri (Windows)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0
        id: tauri-build-windows
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'ChangYan ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Apply ad-hoc signature (macOS fallback)
        if: runner.os == 'macOS' && steps.check-signing.outputs.has_certificate == 'false'
        run: |
          echo "🔐 Applying ad-hoc signature..."

          APP_PATH=$(find src-tauri/target/*/release/bundle/macos -name "*.app" -maxdepth 1 2>/dev/null | head -n 1)

          if [ -n "$APP_PATH" ]; then
            echo "📦 Found: $APP_PATH"

            # Sign all binaries recursively
            find "$APP_PATH/Contents" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) 2>/dev/null | while read binary; do
              echo "  Signing: $binary"
              codesign --force --sign - --timestamp=none "$binary" 2>/dev/null || true
            done

            # Sign the app bundle
            codesign --force --deep --sign - --timestamp=none "$APP_PATH"

            # Verify
            echo "🔍 Verifying signature..."
            codesign -dv "$APP_PATH" 2>&1 | grep -E "(Signature=|Identifier=)" || true

            echo "✅ Ad-hoc signature applied"
          else
            echo "⚠️  No .app bundle found, skipping signature"
          fi

