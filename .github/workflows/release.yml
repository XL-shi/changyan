name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.14)'
        required: true
        default: 'v0.1.14'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # macOS code signing (Developer ID - requires paid Apple Developer account)
          # If not set, ad-hoc signing will be applied in the next step
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'ChangYan ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Apply ad-hoc signature (macOS fallback)
        if: matrix.platform == 'macos-latest'
        run: |
          # This step runs on all macOS builds
          # If APPLE_CERTIFICATE is set, tauri-action already signed it, so we skip
          # If APPLE_CERTIFICATE is not set, we apply ad-hoc signature

          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "✅ Developer ID certificate detected, skipping ad-hoc signature"
            exit 0
          fi

          echo "🔐 No Developer ID certificate found, applying ad-hoc signature..."

          APP_PATH=$(find src-tauri/target/*/release/bundle/macos -name "*.app" -maxdepth 1 2>/dev/null | head -n 1)

          if [ -n "$APP_PATH" ]; then
            echo "📦 Found: $APP_PATH"

            # Sign all binaries recursively
            find "$APP_PATH/Contents" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) 2>/dev/null | while read binary; do
              echo "  Signing: $binary"
              codesign --force --sign - --timestamp=none "$binary" 2>/dev/null || true
            done

            # Sign the app bundle
            codesign --force --deep --sign - --timestamp=none "$APP_PATH"

            # Verify
            echo "🔍 Verifying signature..."
            codesign -dv "$APP_PATH" 2>&1 | grep -E "(Signature=|Identifier=)" || true

            echo "✅ Ad-hoc signature applied"
          else
            echo "⚠️  No .app bundle found, skipping signature"
          fi

      - name: Build PKG installer (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH=$(find src-tauri/target/*/release/bundle/macos -name "*.app" -maxdepth 1 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ]; then
            ./scripts/build-pkg.sh "$APP_PATH"
          fi

      - name: Upload PKG to release (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG_FILE="ChangYan_${VERSION}.pkg"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -f "$PKG_FILE" ]; then
            gh release upload "$TAG" "$PKG_FILE" --clobber
          fi
